<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MotoRAG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #17181a;
    --bg-panel: #1e1f21;
    --bg-panel-raised: #232426;
    --text: #ece8e0;
    --text-dim: #948f85;
    --accent: #e8a33d;
    --accent-dim: #8a6329;
    --danger: #c1443b;
    --border: #35332f;
    --font-display: 'Oswald', sans-serif;
    --font-body: 'IBM Plex Sans', sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    line-height: 1.5;
    min-height: 100vh;
  }

  .page {
    max-width: 760px;
    margin: 0 auto;
    padding: 48px 20px 80px;
  }

  header {
    display: flex;
    align-items: flex-end;
    gap: 14px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 20px;
    margin-bottom: 32px;
  }

  header svg { flex-shrink: 0; }

  h1 {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 34px;
    letter-spacing: 0.5px;
    margin: 0;
    color: var(--text);
  }

  .tagline {
    color: var(--text-dim);
    font-size: 14px;
    margin: 4px 0 0;
  }

  .status {
    margin-left: auto;
    font-size: 12px;
    color: var(--text-dim);
    text-align: right;
    line-height: 1.4;
  }
  .status .dot {
    display: inline-block;
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--text-dim);
    margin-right: 5px;
  }
  .status.ok .dot { background: #7fb069; }
  .status.error .dot { background: var(--danger); }

  .filters {
    display: flex;
    gap: 10px;
    margin-bottom: 16px;
  }

  select {
    flex: 1;
    background: var(--bg-panel);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 10px 12px;
    font-family: var(--font-body);
    font-size: 14px;
  }
  select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }

  .ask-row {
    display: flex;
    gap: 10px;
    align-items: flex-end;
  }

  textarea {
    flex: 1;
    resize: vertical;
    min-height: 52px;
    background: var(--bg-panel);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 12px 14px;
    font-family: var(--font-body);
    font-size: 15px;
  }
  textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  textarea::placeholder { color: var(--text-dim); }

  button {
    font-family: var(--font-display);
    font-size: 16px;
    font-weight: 500;
    letter-spacing: 0.5px;
    background: var(--accent);
    color: #1a1305;
    border: none;
    border-radius: 3px;
    padding: 0 24px;
    height: 52px;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  button:hover:not(:disabled) { background: #f2ae4a; }
  button:disabled {
    background: var(--accent-dim);
    color: #4a3a1a;
    cursor: not-allowed;
  }

  .hint {
    font-size: 12px;
    color: var(--text-dim);
    margin: 8px 0 28px;
  }

  .answer-panel {
    display: none;
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
    border-radius: 3px;
    padding: 22px 24px;
    margin-bottom: 24px;
  }
  .answer-panel.visible { display: block; }
  .answer-panel .label {
    font-family: var(--font-display);
    font-size: 12px;
    letter-spacing: 1px;
    color: var(--accent);
    margin: 0 0 10px;
  }
  .answer-text {
    font-size: 16px;
    white-space: pre-wrap;
    margin: 0;
  }
  .answer-text.loading {
    color: var(--text-dim);
    font-style: italic;
  }

  .sources {
    display: none;
  }
  .sources.visible { display: block; }
  .sources .label {
    font-family: var(--font-display);
    font-size: 12px;
    letter-spacing: 1px;
    color: var(--text-dim);
    margin: 0 0 12px;
    padding-top: 8px;
    border-top: 1px solid var(--border);
  }

  .source-card {
    background: var(--bg-panel-raised);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 14px 16px;
    margin-bottom: 10px;
  }
  .source-card .source-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
    margin-bottom: 6px;
  }
  .source-card .bike-name {
    font-family: var(--font-display);
    font-size: 15px;
    color: var(--text);
  }
  .source-card .rank-tag {
    font-family: var(--font-display);
    font-size: 12px;
    color: var(--accent);
    flex-shrink: 0;
  }
  .source-card .snippet {
    font-size: 13px;
    color: var(--text-dim);
    margin: 0 0 8px;
  }
  .source-card a {
    font-size: 12px;
    color: var(--accent);
    text-decoration: none;
  }
  .source-card a:hover { text-decoration: underline; }

  .error-box {
    display: none;
    background: rgba(193, 68, 59, 0.12);
    border: 1px solid var(--danger);
    border-radius: 3px;
    padding: 14px 16px;
    margin-bottom: 24px;
    font-size: 14px;
    color: #e8a49f;
  }
  .error-box.visible { display: block; }

  @media (prefers-reduced-motion: no-preference) {
    .answer-panel.visible, .sources.visible { animation: rise 0.2s ease; }
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>
<div class="page">

  <header>
    <svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="9" cy="29" r="7" stroke="#e8a33d" stroke-width="2"/>
      <circle cx="31" cy="29" r="7" stroke="#e8a33d" stroke-width="2"/>
      <path d="M9 29L17 14H24M31 29L24 14M24 14L20 22H12" stroke="#ece8e0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <div>
      <h1>MotoRAG</h1>
      <p class="tagline">Answers grounded in real review video transcripts</p>
    </div>
    <div class="status" id="status"><span class="dot"></span>connecting...</div>
  </header>

  <div class="filters">
    <select id="motorcycleSelect">
      <option value="">All motorcycles</option>
    </select>
  </div>

  <div class="ask-row">
    <textarea id="question" placeholder="e.g. What is the seat height of the Aprilia RS 457?"></textarea>
    <button id="askBtn">Ask</button>
  </div>
  <p class="hint">Pick a specific motorcycle above for more precise answers, or leave it on "All motorcycles" to search everything.</p>

  <div class="error-box" id="errorBox"></div>

  <div class="answer-panel" id="answerPanel">
    <p class="label">Answer</p>
    <p class="answer-text" id="answerText"></p>
  </div>

  <div class="sources" id="sourcesSection">
    <p class="label">Sources</p>
    <div id="sourcesList"></div>
  </div>

</div>

<script>
  const API_BASE = "http://localhost:8000"; // change if you ran uvicorn on a different port

  const statusEl = document.getElementById('status');
  const selectEl = document.getElementById('motorcycleSelect');
  const questionEl = document.getElementById('question');
  const askBtn = document.getElementById('askBtn');
  const answerPanel = document.getElementById('answerPanel');
  const answerText = document.getElementById('answerText');
  const sourcesSection = document.getElementById('sourcesSection');
  const sourcesList = document.getElementById('sourcesList');
  const errorBox = document.getElementById('errorBox');

  function showError(msg) {
    errorBox.textContent = msg;
    errorBox.classList.add('visible');
  }
  function clearError() {
    errorBox.classList.remove('visible');
    errorBox.textContent = '';
  }

  async function checkHealth() {
    try {
      const res = await fetch(`${API_BASE}/health`);
      if (!res.ok) throw new Error();
      const data = await res.json();
      statusEl.innerHTML = `<span class="dot"></span>${data.chunks_loaded} chunks loaded`;
      statusEl.classList.add('ok');
    } catch (e) {
      statusEl.innerHTML = `<span class="dot"></span>backend not reachable`;
      statusEl.classList.add('error');
      showError(`Can't reach the backend at ${API_BASE}. Make sure rag_backend.py is running (uvicorn rag_backend:app --reload --port 8000).`);
    }
  }

  async function loadMotorcycles() {
    try {
      const res = await fetch(`${API_BASE}/motorcycles`);
      if (!res.ok) return;
      const bikes = await res.json();
      const byBrand = {};
      for (const b of bikes) {
        const brand = b.brand || 'Other';
        (byBrand[brand] = byBrand[brand] || []).push(b);
      }
      for (const brand of Object.keys(byBrand).sort()) {
        const group = document.createElement('optgroup');
        group.label = brand;
        for (const b of byBrand[brand]) {
          const opt = document.createElement('option');
          opt.value = b.motorcycle_id;
          opt.textContent = `${b.model} ${b.variant || ''}`.trim();
          group.appendChild(opt);
        }
        selectEl.appendChild(group);
      }
    } catch (e) { /* health check already surfaces the connection error */ }
  }

  async function ask() {
    const question = questionEl.value.trim();
    if (!question) return;

    clearError();
    askBtn.disabled = true;
    answerPanel.classList.add('visible');
    answerText.textContent = 'Searching reviews and thinking...';
    answerText.classList.add('loading');
    sourcesSection.classList.remove('visible');
    sourcesList.innerHTML = '';

    try {
      const res = await fetch(`${API_BASE}/ask`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          question,
          motorcycle_id: selectEl.value || null,
        }),
      });

      const data = await res.json();
      if (!res.ok) {
        throw new Error(data.detail || `Request failed (${res.status})`);
      }

      answerText.textContent = data.answer;
      answerText.classList.remove('loading');

      if (data.sources && data.sources.length) {
        sourcesSection.classList.add('visible');
        data.sources.forEach((s, i) => {
          const card = document.createElement('div');
          card.className = 'source-card';
          const bike = [s.brand, s.model, s.variant].filter(Boolean).join(' ');
          card.innerHTML = `
            <div class="source-head">
              <span class="bike-name">${bike || 'Unknown motorcycle'}</span>
              <span class="rank-tag">[${i + 1}]</span>
            </div>
            <p class="snippet">"${s.snippet}"</p>
            ${s.youtube_url ? `<a href="${s.youtube_url}" target="_blank" rel="noopener">Watch source video →</a>` : ''}
          `;
          sourcesList.appendChild(card);
        });
      }
    } catch (e) {
      answerPanel.classList.remove('visible');
      showError(e.message || 'Something went wrong asking the backend.');
    } finally {
      askBtn.disabled = false;
    }
  }

  askBtn.addEventListener('click', ask);
  questionEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      ask();
    }
  });

  checkHealth();
  loadMotorcycles();
</script>
</body>
</html>
